
plugins {
    id "org.sonarqube" version "7.0.1.6134"
}

apply plugin: 'com.android.application'

android {

    buildFeatures {
        buildConfig = true
    }
    lint {
        checkReleaseBuilds = false
    }
    namespace = 'es.gob.afirma'
    compileSdk = 36
    defaultConfig {
        applicationId "es.gob.afirma"
        minSdkVersion 26
        targetSdkVersion 36
        multiDexEnabled = true
        versionCode 32
        versionName "1.9.4"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            pickFirsts += ['ACRAIZ-SHA2.crt']
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }


    // Los otros proyectos de Afirma tienen dependencias que entran en conflicto
    // con las clases de Android, silenciamos los errores hasta que se arreglen

    sourceSets.main.java.filter.exclude 'com/**/package-info.*'
}

repositories {
    mavenLocal()
    google()
    maven { url "https://jitpack.io" }
}

dependencies {

    implementation project(':pdfium')

	implementation 'com.google.android.material:material:1.13.0'

    implementation ('es.gob.afirma.jmulticard:jmulticard-android:2.1') {
        exclude(module: 'support-v4')
        exclude(module: 'android')
    }
    implementation 'es.gob.afirma.jmulticard:jmulticard-jse:2.1-SNAPSHOT'

    implementation('es.gob.afirma:afirma-crypto-pdf:1.10-SNAPSHOT') {
        exclude(module: 'afirma-lib-itext')
    }
    implementation 'es.gob.afirma.lib:openpdf:1.3.43.1'
    implementation 'com.github.andob:android-awt:1.0.0'
    implementation 'es.gob.afirma:afirma-core:1.10-SNAPSHOT'
    implementation ('es.gob.afirma:afirma-core-keystores:1.10-SNAPSHOT') {
        exclude(group: 'es.gob.afirma.jmulticard')
    }
    implementation 'es.gob.afirma:afirma-crypto-cades:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-cadestri-client:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-xadestri-client:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-padestri-client:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-cades-multi:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-core-pkcs7:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-core-pkcs7-tsp:1.10-SNAPSHOT'
    implementation 'es.gob.afirma:afirma-crypto-cipher2:1.10-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.13.2'

    // Agregamos la dependencia necesaria para la previsualizacion de PDFs,
    // pero excluimos "pdfium-android" de la cual depende por contener
    // binarios que no admiten la paginacion de 16 Kb que exige Android 15
    // y superiores. En su lugar, incluimos estas bibliotecas dentro de la
    // propia aplicacion, en el modulo pdfium
    implementation ('com.github.mhiew:android-pdf-viewer:3.2.0-beta.3') {
        exclude(group: 'com.github.mhiew', module: "pdfium-android")
    }

    // Java language implementation
    implementation "androidx.fragment:fragment:1.8.9"


    // Restricciones para evitar clases duplicadas debido a dependencias
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}
